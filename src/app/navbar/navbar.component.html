<nav class="navbar">
  <div class="navbar-container">
    <!-- Logo -->
    <a routerLink="/book" class="navbar-logo"> 📚 BookCRUD </a>

    <!-- Menu -->
    <div class="navbar-menu">
      <a routerLink="/book" routerLinkActive="active" class="navbar-link">
        Books
      </a>

      @if (userLevel === "ADMIN") {
        <a routerLink="/admin" routerLinkActive="active" class="navbar-link">
          Admin
        </a>
      }

      @if (isLoggedIn) {
        <span class="navbar-user"> สวัสดี, {{ userName }} </span>

        <button
          type="button"
          class="navbar-link navbar-logout"
          (click)="logout()"
        >
          Logout
        </button>
      } @else {
        <a routerLink="/login" routerLinkActive="active" class="navbar-link">
          Login
        </a>

        <a routerLink="/register" routerLinkActive="active" class="navbar-link">
          Register
        </a>
      }
    </div>
  </div>
</nav>
